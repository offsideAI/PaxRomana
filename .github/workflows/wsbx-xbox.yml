# Builds the WSBX Xbox (UWP, x64) package on a Windows runner, because UWP cannot be built on macOS.
# Download the "wsbx-xbox-package" artifact and install it on a Dev Mode console (see WSBX-src/README.md).
name: WSBX Xbox package

on:
  workflow_dispatch:
  push:
    paths:
      - 'WSBX-src/**'
      - '.github/workflows/wsbx-xbox.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: List installed Windows SDKs
        shell: powershell
        run: Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Platforms\UAP" | Select-Object -ExpandProperty Name

      # Same script as a local Windows build: creates a throwaway signing certificate and runs MSBuild.
      - name: Build package
        shell: powershell
        run: .\WSBX-src\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: wsbx-xbox-package
          path: WSBX-src/package
          if-no-files-found: error
